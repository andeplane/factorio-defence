<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factorio Defence</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; font: 13px/1.4 system-ui, sans-serif; color: #e8e2d0; }
      #app canvas { display: block; }
      .panel { position: fixed; background: rgba(40, 38, 34, 0.88); border: 2px solid #121110; box-shadow: inset 0 0 0 1px #57534a; padding: 8px 10px; user-select: none; }
      #info { top: 10px; left: 10px; white-space: pre; font-family: ui-monospace, monospace; font-size: 12px; pointer-events: none; }
      #help { top: 10px; right: 10px; max-width: 260px; pointer-events: none; }
      #hotbar { bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 40px); }
      #hotbar button { font: inherit; color: inherit; background: #3e3b35; border: 1px solid #121110; box-shadow: inset 0 1px 0 #6a655a; padding: 6px 10px; cursor: pointer; }
      #hotbar button.active { background: #c48a1e; color: #1b1b1b; }
      kbd { font-family: ui-monospace, monospace; opacity: 0.7; }
      .fatal { position: fixed; inset: 20px; color: #ff8080; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="info" class="panel"></div>
    <div id="help" class="panel">
      <b>Controls</b><br />
      WASD / drag: pan · wheel: zoom<br />
      1-6: pick entity · R: rotate · Q: clear<br />
      Left click: place · Right click: remove
    </div>
    <div id="hotbar" class="panel"></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
